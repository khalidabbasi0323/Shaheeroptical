<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shaheer Opticals - Live Management Panel</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-900 text-gray-100 min-h-screen">

  <!-- LOGIN BYPASS SECTION -->
  <div id="login-section" class="flex items-center justify-center min-h-screen px-4">
    <div class="max-w-md w-full bg-gray-800 p-8 rounded-xl shadow-2xl border border-gray-700 text-center">
      <div class="w-16 h-16 bg-yellow-500/10 text-yellow-500 rounded-full flex items-center justify-center mx-auto mb-4 border border-yellow-500/20">
        <i class="fa-solid fa-glasses text-3xl"></i>
      </div>
      <h2 class="text-3xl font-bold text-yellow-500 mb-2">Shaheer Opticals</h2>
      <p class="text-gray-400 text-sm mb-6">Live Website Database Control</p>
      
      <button id="bypass-btn" class="w-full bg-yellow-500 hover:bg-yellow-400 text-black font-bold py-3.5 px-4 rounded-lg shadow-lg transition flex items-center justify-center gap-2">
        <i class="fa-solid fa-bolt text-lg"></i>
        <span>Open Live Admin Panel</span>
      </button>
    </div>
  </div>

  <!-- MAIN DASHBOARD -->
  <div id="dashboard-section" class="hidden min-h-screen p-4 md:p-8">
    <header class="flex flex-col md:flex-row justify-between items-center bg-gray-800 p-4 rounded-xl border border-gray-700 mb-6 gap-4">
      <div class="flex items-center gap-3">
        <i class="fa-solid fa-glasses text-2xl text-yellow-500"></i>
        <h1 class="text-xl font-bold text-white">Shaheer Opticals Portal</h1>
      </div>
      <div class="flex items-center gap-3">
        <span id="db-status" class="bg-green-500/10 text-green-400 text-xs px-3 py-1.5 rounded-full border border-green-500/30 font-medium">
          <i class="fa-solid fa-circle text-[8px] mr-1"></i> Live DB Connected
        </span>
        <button onclick="location.reload()" class="bg-gray-700 hover:bg-gray-600 text-white px-3 py-1.5 rounded-lg text-xs font-semibold">
          <i class="fa-solid fa-rotate mr-1"></i> Refresh Data
        </button>
      </div>
    </header>

    <!-- GRID: Product Form & Live Inventory -->
    <div class="grid grid-cols-1 lg:grid-cols-3 gap-8 mb-8">
      
      <!-- ADD / EDIT FORM -->
      <div class="bg-gray-800 p-6 rounded-xl border border-gray-700 h-fit">
        <h2 id="form-title" class="text-lg font-bold text-yellow-500 mb-4 flex items-center gap-2">
          <i class="fa-solid fa-plus-circle"></i> Add Live Product
        </h2>
        
        <form id="product-form" class="space-y-4">
          <input type="hidden" id="product-id">
          
          <div>
            <label class="block text-xs text-gray-400 mb-1">Product Title</label>
            <input type="text" id="p-name" required class="w-full bg-gray-700 border border-gray-600 rounded-lg p-2.5 text-white text-sm focus:border-yellow-500 focus:outline-none" placeholder="Ray-Ban Aviator">
          </div>

          <div class="grid grid-cols-2 gap-3">
            <div>
              <label class="block text-xs text-gray-400 mb-1">Category</label>
              <select id="p-category" class="w-full bg-gray-700 border border-gray-600 rounded-lg p-2.5 text-white text-sm focus:border-yellow-500 focus:outline-none">
                <option value="Eyeglasses">Eyeglasses</option>
                <option value="Sunglasses">Sunglasses</option>
                <option value="Contact Lenses">Contact Lenses</option>
                <option value="Accessories">Accessories</option>
              </select>
            </div>
            <div>
              <label class="block text-xs text-gray-400 mb-1">Price (PKR)</label>
              <input type="number" id="p-price" required class="w-full bg-gray-700 border border-gray-600 rounded-lg p-2.5 text-white text-sm focus:border-yellow-500 focus:outline-none" placeholder="2500">
            </div>
          </div>

          <div class="grid grid-cols-2 gap-3">
            <div>
              <label class="block text-xs text-gray-400 mb-1">Stock</label>
              <input type="number" id="p-stock" class="w-full bg-gray-700 border border-gray-600 rounded-lg p-2.5 text-white text-sm focus:border-yellow-500 focus:outline-none" placeholder="10">
            </div>
            <div>
              <label class="block text-xs text-gray-400 mb-1">Image URL</label>
              <input type="text" id="p-image" class="w-full bg-gray-700 border border-gray-600 rounded-lg p-2.5 text-white text-sm focus:border-yellow-500 focus:outline-none" placeholder="https://...">
            </div>
          </div>

          <button type="submit" id="save-btn" class="w-full bg-yellow-500 hover:bg-yellow-400 text-black font-bold py-2.5 rounded-lg transition text-sm">
            Publish to Live Website
          </button>
        </form>
      </div>

      <!-- LIVE INVENTORY TABLE -->
      <div class="lg:col-span-2 bg-gray-800 p-6 rounded-xl border border-gray-700">
        <h2 class="text-lg font-bold text-white mb-4"><i class="fa-solid fa-boxes-stacked mr-2"></i> Live Website Products</h2>
        <div class="overflow-x-auto">
          <table class="w-full text-left text-sm text-gray-300">
            <thead class="bg-gray-700/50 text-xs text-gray-400 uppercase">
              <tr>
                <th class="p-3">Product</th>
                <th class="p-3">Category</th>
                <th class="p-3">Price</th>
                <th class="p-3 text-right">Actions</th>
              </tr>
            </thead>
            <tbody id="products-tbody" class="divide-y divide-gray-700">
              <tr><td colspan="4" class="p-4 text-center text-gray-400">Loading live products...</td></tr>
            </tbody>
          </table>
        </div>
      </div>

    </div>
  </div>
  <script>
    let supabaseClient = null;

    // Check if main site config exists or create from window
    function initSupabase() {
      if (window.supabaseClient) {
        supabaseClient = window.supabaseClient;
      } else if (window._supabase) {
        supabaseClient = window._supabase;
      } else if (window.supabase) {
        // Fallback: Reading key directly from main website's saved config
        const savedUrl = localStorage.getItem('supabase_url') || 'https://dyktxqujiwmxnxsttwng.supabase.co';
        const savedKey = localStorage.getItem('supabase_key') || localStorage.getItem('sb-anon-key');
        
        if (savedKey) {
          supabaseClient = window.supabase.createClient(savedUrl, savedKey);
        }
      }
    }

    document.getElementById('bypass-btn')?.addEventListener('click', () => {
      document.getElementById('login-section').classList.add('hidden');
      document.getElementById('dashboard-section').classList.remove('hidden');
      initSupabase();
      fetchLiveProducts();
    });

    // Fetch Live Products
    async function fetchLiveProducts() {
      const tbody = document.getElementById('products-tbody');
      
      if (!supabaseClient) {
        // If client is still null, try finding Supabase config from index/main script
        initSupabase();
      }

      if (!supabaseClient) {
        tbody.innerHTML = `<tr><td colspan="4" class="p-4 text-center text-amber-400">Please open main website (index.html) once to sync API Key, then refresh this page.</td></tr>`;
        return;
      }

      const { data, error } = await supabaseClient.from('products').select('*');
      
      if (error) {
        tbody.innerHTML = `<tr><td colspan="4" class="p-4 text-center text-red-400">Error loading DB: ${error.message}</td></tr>`;
        return;
      }

      if (!data || data.length === 0) {
        tbody.innerHTML = `<tr><td colspan="4" class="p-4 text-center text-gray-400">No products found in live database table.</td></tr>`;
        return;
      }

      tbody.innerHTML = data.map(p => `
        <tr class="hover:bg-gray-750">
          <td class="p-3 font-medium text-white flex items-center gap-2">
            ${p.image || p.image_url ? `<img src="${p.image || p.image_url}" class="w-8 h-8 rounded object-cover">` : '<i class="fa-solid fa-glasses text-gray-500"></i>'}
            ${p.title || p.name || 'Unnamed Frame'}
          </td>
          <td class="p-3">${p.category || 'General'}</td>
          <td class="p-3 text-yellow-400 font-semibold">Rs. ${p.price || 0}</td>
          <td class="p-3 text-right">
            <button onclick="deleteLiveProduct('${p.id}')" class="text-red-400 hover:text-red-300"><i class="fa-solid fa-trash"></i></button>
          </td>
        </tr>
      `).join('');
    }

    // Insert Product
    document.getElementById('product-form')?.addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const name = document.getElementById('p-name').value;
      const category = document.getElementById('p-category').value;
      const price = parseFloat(document.getElementById('p-price').value);
      const image = document.getElementById('p-image').value;

      if (!supabaseClient) {
        alert("❌ Supabase client not initialized.");
        return;
      }

      const { data, error } = await supabaseClient.from('products').insert([
        { title: name, category: category, price: price, image: image }
      ]);

      if (error) {
        alert("❌ Error uploading to live site: " + error.message);
      } else {
        alert("✅ Product published live successfully!");
        document.getElementById('product-form').reset();
        fetchLiveProducts();
      }
    });

    // Delete Product
    async function deleteLiveProduct(id) {
      if (!confirm("Are you sure you want to delete this from the live store?")) return;
      const { error } = await supabaseClient.from('products').delete().eq('id', id);
      if (error) alert("Error: " + error.message);
      else fetchLiveProducts();
    }
  </script>
</body>
</html>
