<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shaheer Opticals - Admin Panel</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Supabase JS Library -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-900 text-gray-100 min-h-screen">

  <!-- 1. LOGIN SECTION -->
  <div id="login-section" class="flex items-center justify-center min-h-screen px-4">
    <div class="max-w-md w-full bg-gray-800 p-8 rounded-xl shadow-2xl border border-gray-700">
      <h2 class="text-3xl font-bold text-center text-yellow-500 mb-6">Shaheer Opticals</h2>
      
      <form id="login-form" class="space-y-4">
        <div>
          <label class="block text-sm font-medium text-gray-300 mb-1">Email Address</label>
          <input type="email" id="login-email" class="w-full p-3 bg-gray-700 border border-gray-600 rounded-lg text-white focus:outline-none focus:border-yellow-500" placeholder="admin@shaheeroptical.com">
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-300 mb-1">Password</label>
          <input type="password" id="login-password" class="w-full p-3 bg-gray-700 border border-gray-600 rounded-lg text-white focus:outline-none focus:border-yellow-500" placeholder="••••••••">
        </div>
        
        <button type="submit" class="w-full bg-yellow-600 hover:bg-yellow-500 text-black font-bold py-3 rounded-lg transition">
          Login via Supabase
        </button>
      </form>

      <div class="mt-6 pt-6 border-t border-gray-700 text-center">
        <button id="demo-login-btn" type="button" class="w-full bg-gray-700 hover:bg-gray-600 text-yellow-400 font-semibold py-3 rounded-lg border border-yellow-500/30 transition">
          ⚡ Direct Admin Bypass (Click Here)
        </button>
      </div>
    </div>
  </div>

  <!-- 2. DASHBOARD SECTION (Initially Hidden) -->
  <div id="dashboard-section" class="hidden min-h-screen p-6">
    <!-- Top Navbar -->
    <header class="flex justify-between items-center bg-gray-800 p-4 rounded-xl border border-gray-700 mb-6">
      <h1 class="text-xl font-bold text-yellow-500"><i class="fa-solid fa-glasses mr-2"></i> Shaheer Opticals Admin</h1>
      <button onclick="handleLogout()" class="bg-red-600 hover:bg-red-500 text-white px-4 py-2 rounded-lg text-sm font-semibold transition">
        Logout
      </button>
    </header>

    <!-- Metrics Stats -->
    <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
      <div class="bg-gray-800 p-5 rounded-xl border border-gray-700">
        <p class="text-gray-400 text-sm">Total Products</p>
        <h3 id="stat-products" class="text-2xl font-bold text-white mt-1">0</h3>
      </div>
      <div class="bg-gray-800 p-5 rounded-xl border border-gray-700">
        <p class="text-gray-400 text-sm">System Status</p>
        <h3 class="text-2xl font-bold text-green-400 mt-1">Active</h3>
      </div>
      <div class="bg-gray-800 p-5 rounded-xl border border-gray-700">
        <p class="text-gray-400 text-sm">Database</p>
        <h3 id="stat-db" class="text-2xl font-bold text-yellow-400 mt-1">Connected</h3>
      </div>
    </div>

    <!-- Main Content Area -->
    <div class="bg-gray-800 p-6 rounded-xl border border-gray-700">
      <h2 class="text-lg font-bold text-white mb-4">Admin Dashboard Loaded Successfully!</h2>
      <p class="text-gray-400">Aap ka Dashboard ab live ho chuka hai. Yahan aap ke baqi sab modules render honge.</p>
    </div>
  </div>

  <!-- 3. JAVASCRIPT SYSTEM -->
  <script>
    // Supabase Credentials
    const SUPABASE_URL = 'https://dyktxqujiwmxnxsttwng.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImR5a3R4cXVqaXdteG54c3R0d25nIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NDEyMzQ1NjcsImV4cCI6MjA1NjgxMDU2N30';

    let supabaseClient = null;

    // Initialize Supabase safely
    try {
      if (window.supabase) {
        supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
      }
    } catch(e) {
      console.warn("Supabase Init Warning:", e);
    }

    // Force Open Function (Instant Bypass)
    function openDashboardDirectly() {
      const loginSec = document.getElementById('login-section');
      const dashSec = document.getElementById('dashboard-section');

      if (loginSec) loginSec.classList.add('hidden');
      if (dashSec) dashSec.classList.remove('hidden');
    }

    // DOM Ready Event Listeners
    document.addEventListener('DOMContentLoaded', () => {
      const loginForm = document.getElementById('login-form');
      const demoBtn = document.getElementById('demo-login-btn');

      // Demo Bypass Click Event
      if (demoBtn) {
        demoBtn.addEventListener('click', () => {
          alert("⚡ Direct Admin Bypass Activated!");
          openDashboardDirectly();
        });
      }

      // Real Login Submission
      if (loginForm) {
        loginForm.addEventListener('submit', async (e) => {
          e.preventDefault();
          const email = document.getElementById('login-email').value;
          const password = document.getElementById('login-password').value;

          if (!supabaseClient) {
            alert("⚠️ Supabase Client Connect Nahi Hua! Bypass Button Use Karein.");
            openDashboardDirectly();
            return;
          }

          try {
            const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });
            if (error) {
              alert("❌ Supabase Auth Error: " + error.message + "\n\n(Bypass se Dashboard Khol Rahe Hain)");
              openDashboardDirectly();
            } else {
              alert("✅ Login Successful!");
              openDashboardDirectly();
            }
          } catch(err) {
            alert("❌ Network Error! Bypass Mode Enabled.");
            openDashboardDirectly();
          }
        });
      }
    });

    // Logout Function
    function handleLogout() {
      const loginSec = document.getElementById('login-section');
      const dashSec = document.getElementById('dashboard-section');

      if (dashSec) dashSec.classList.add('hidden');
      if (loginSec) loginSec.classList.remove('hidden');
      alert("Logged out!");
    }
  </script>
</body>
</html>
