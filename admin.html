<div class="text-center mb-8">
    <div class="w-14 h-14 mx-auto rounded-2xl bg-gradient-to-br from-gold-500 to-amber-700 p-[1px] mb-4 shadow-lg shadow-gold-500/20 flex items-center justify-center">
      <div class="w-full h-full bg-dark-950 rounded-[15px] flex items-center justify-center">
        <i class="fa-solid fa-glasses text-2xl text-gold-500"></i>
      </div>
    </div>
    <h1 class="text-xl font-bold tracking-tight text-white">SHAHEER OPTICALS</h1>
    <p class="text-xs text-zinc-400 font-mono uppercase tracking-widest mt-1">Admin Dashboard Portal</p>
  </div>

  <form id="loginForm" onsubmit="handleLogin(event)" class="space-y-4">
    <div>
      <label class="block text-xs font-medium text-zinc-300 mb-1.5">Admin Email</label>
      <div class="relative">
        <i class="fa-solid fa-envelope text-zinc-500 text-xs absolute left-3.5 top-1/2 -translate-y-1/2"></i>
        <input 
          type="email" 
          id="adminEmail" 
          required 
          placeholder="admin@shaheeropticals.com"
          class="w-full bg-dark-950 border border-zinc-800 focus:border-gold-500 rounded-xl pl-9 pr-4 py-2.5 text-xs text-white placeholder-zinc-600 focus:outline-none focus:ring-1 focus:ring-gold-500/40"
        />
      </div>
    </div>

    <div>
      <label class="block text-xs font-medium text-zinc-300 mb-1.5">Security Password</label>
      <div class="relative">
        <i class="fa-solid fa-lock text-zinc-500 text-xs absolute left-3.5 top-1/2 -translate-y-1/2"></i>
        <input 
          type="password" 
          id="adminPassword" 
          required 
          placeholder="••••••••••••"
          class="w-full bg-dark-950 border border-zinc-800 focus:border-gold-500 rounded-xl pl-9 pr-4 py-2.5 text-xs text-white placeholder-zinc-600 focus:outline-none focus:ring-1 focus:ring-gold-500/40"
        />
      </div>
    </div>

    <div id="loginErrorMsg" class="hidden p-3 rounded-xl bg-rose-950/40 border border-rose-800/60 text-rose-300 text-xs flex items-center gap-2">
      <i class="fa-solid fa-circle-exclamation flex-shrink-0"></i>
      <span id="loginErrorText">Invalid email or password</span>
    </div>

    <button 
      type="submit" 
      id="loginSubmitBtn"
      class="w-full py-3 px-4 rounded-xl bg-gradient-to-r from-gold-500 to-gold-600 hover:from-gold-400 hover:to-gold-500 text-black font-bold text-xs tracking-wider uppercase transition shadow-lg shadow-gold-500/10 flex items-center justify-center gap-2"
    >
      <i class="fa-solid fa-right-to-bracket"></i>
      <span>Secure Sign In</span>
    </button>

    <div class="pt-4 border-t border-zinc-800/80 text-center">
      <button 
        type="button" 
        onclick="enableDemoAdminMode()" 
        class="text-[11px] text-gold-400/80 hover:text-gold-300 underline font-mono"
      >
        Quick Admin Bypass (Local / Demo Session)
      </button>
    </div>
  </form>
</div>
